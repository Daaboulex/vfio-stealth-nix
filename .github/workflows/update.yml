name: Update
on:
  schedule:
    - cron: "0 6 * * 0"
    - cron: "0 6 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name != 'schedule'
      || github.event.schedule == '0 6 * * 0'
      || (vars.UPDATE_CADENCE || 'daily') == 'daily'
    uses: Daaboulex/nix-packaging-standard/.github/workflows/package-update.yml@release
    with:
      cadence: ${{ vars.UPDATE_CADENCE || 'daily' }}
