name: Maintenance
on:
  schedule:
    - cron: "0 4 * * 0"
    - cron: "0 4 * * 3"
    - cron: "0 4 * * 1,2,4,5,6"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  maintenance:
    if: >-
      github.event_name != 'schedule'
      || github.event.schedule == '0 4 * * 0'
      || vars.MAINTENANCE_CADENCE == 'daily'
      || (vars.MAINTENANCE_CADENCE == 'biweekly' && github.event.schedule == '0 4 * * 3')
    uses: Daaboulex/nix-packaging-standard/.github/workflows/package-maintenance.yml@release
    with:
      cadence: ${{ vars.MAINTENANCE_CADENCE || 'weekly' }}
